<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="topbar">
  <a class="logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <a class="gh" href="https://github.com/{{ site.author }}/Dev-Study-Diary" target="_blank" rel="noopener">GitHub</a>
</header>

<main class="wrap">{{ content }}</main>

<footer>© {{ site.time | date: "%Y" }} {{ site.author }}</footer>
</body>
</html>
